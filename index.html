html,body{height:100%;margin:0}

#hb{position:absolute;top:10px;left:10px;border:0;border-radius:14px;background:#fffc;color:var(--ink);font:inherit;font-weight:800;padding:8px 14px}
#lb{position:absolute;top:10px;right:10px;background:#fffc;border-radius:14px;padding:6px 10px;font-size:13px;min-width:130px}

i.d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#mmw{position:absolute;left:10px;bottom:10px;background:#fffc;border-radius:16px;padding:6px;text-align:center}
#mm{width:130px;height:126px;display:block}
#pct{font-weight:800;font-size:15px;margin-top:2px}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#ffe27a;border-radius:14px;padding:6px 14px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none}
#home{position:absolute;inset:0;overflow:auto;background:linear-gradient(#fdf0ff,#e8f4ff)}
#home.h{display:none}
.in{max-width:420px;margin:0 auto;padding:16px;text-align:center}
#logo svg{width:84px;height:84px}
h1{margin:4px 0 0;font-size:34px}
.tag{margin:2px 0 12px}
#nm{width:100%;box-sizing:border-box;font:inherit;font-size:18px;text-align:center;padding:10px;border-radius:14px;border:2px solid #e3d3ff;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.tk{margin:12px 0 4px;font-size:16px}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ffc93c;border:2px solid #e09a00;vertical-align:-2px;margin-right:3px;box-sizing:border-box}
#msg{min-height:20px;margin-bottom:6px;font-weight:700;color:#d04a8a}
#shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ch{background:#fff;border:3px solid #eadcff;border-radius:16px;padding:6px 2px;font:inherit;color:var(--ink);cursor:pointer}
.ch.s{border-color:var(--pur);background:#f6edff}
.ch .pr{font-size:13px;font-weight:700}
#go{width:100%;font:inherit;font-size:22px;font-weight:800;color:#fff;background:var(--pur);border:0;border-radius:18px;padding:13px;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
#end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff9}
#end.h{display:none}
.card{background:#fff;border-radius:24px;padding:20px;width:min(320px,90%);text-align:center;box-shadow:0 6px 24px #a974ff44}
.card h2{margin:0 0 6px}
#end button{display:block;width:100%;margin-top:10px;font:inherit;font-size:20px;font-weight:800;border:0;border-radius:16px;padding:12px;cursor:pointer;color:#fff;background:var(--pur)}
#eh{background:#7fb2ff!important}
.cd{display:flex;gap:6px;margin-bottom:6px}
#cd{flex:1;min-width:0;box-sizing:border-box;font:inherit;font-size:16px;text-align:center;padding:9px;border-radius:14px;border:2px solid #e3d3ff;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
#rd{font:inherit;font-weight:800;color:#fff;background:#7fb2ff;border:0;border-radius:14px;padding:0 14px}
#tkc{position:absolute;right:10px;bottom:10px;background:#fffc;border-radius:14px;padding:6px 12px;font-weight:800;font-size:18px}
.card{max-height:88%;overflow:auto}
.sm{font-size:13px;margin:6px 0}
#opp{width:100%;font:inherit;padding:8px;border-radius:12px;border:2px solid #e3d3ff;margin-bottom:2px}
#rv{background:#ff9f43!important}
#sc{background:#ff5f8f!important}
